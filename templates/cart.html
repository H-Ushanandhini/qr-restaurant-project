<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Your Cart</h1>

    {% if cart_items %}
        <table>
            <tr><th>Item</th><th>Qty</th><th>Subtotal</th></tr>
            {% for name, qty, subtotal in cart_items %}
            <tr>
                <td>{{ name }}</td>
                <td>{{ qty }}</td>
                <td>Rs.{{ subtotal }}</td>
            </tr>
            {% endfor %}
        </table>
        <h3 style="margin: 15px 0;">Total: Rs.{{ total }}</h3>
        <form action="/place_order" method="POST">
            <button type="submit">Place Order</button>
        </form>
    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}

    <p style="margin-top:15px;"><a href="/menu">← Back to Menu</a></p>
</div>
</body>
</html>
