<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Live Orders</h1>

    <table>
        <tr><th>Order ID</th><th>Status</th><th>Created At</th><th>Update</th></tr>
        {% for order in orders %}
        <tr>
            <td>{{ order.order_id }}</td>
            <td>{{ order.status }}</td>
            <td>{{ order.created_at }}</td>
            <td>
                <form action="/admin/update_status/{{ order.order_id }}" method="POST" style="display:flex; gap:6px;">
                    <select name="status">
                        <option value="Pending" {% if order.status == 'Pending' %}selected{% endif %}>Pending</option>
                        <option value="Preparing" {% if order.status == 'Preparing' %}selected{% endif %}>Preparing</option>
                        <option value="Served" {% if order.status == 'Served' %}selected{% endif %}>Served</option>
                    </select>
                    <button type="submit">Update</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
